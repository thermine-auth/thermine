<!doctype html>
<!-- The placeholder on the html tag below is replaced in hooks.server.ts with
     the reader's saved theme, so the page arrives already dark or light. Do
     not repeat that token anywhere above this line: only its first occurrence
     is substituted. -->
<html lang="en" __THEME__>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
