<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applies the saved theme before the first paint, so a reader who
			// chose dark never sees a flash of the light one. The key and the
			// attribute match src/lib/theme.svelte.ts.
			try {
				var saved = localStorage.getItem('xermess-theme');
				if (saved !== 'light' && saved !== 'dark') {
					saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', saved);
			} catch (e) {
				// Without storage the stylesheet falls back to the system setting.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
